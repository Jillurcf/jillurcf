<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="40%" stop-color="#0B132B" />
      <stop offset="70%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#38BDF8">
        <animate attributeName="stop-color" 
          values="#38BDF8;#818CF8;#C084FC;#38BDF8" 
          dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Glow Orbs -->
    <radialGradient id="orbCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbPurple" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbPink" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>

    <!-- Scan Beam Gradient -->
    <linearGradient id="beamGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1.2" fill="#38BDF8" fill-opacity="0.3" />
    </pattern>

    <!-- CSS Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-5px) scale(1.02); }
      }
      @keyframes beamSweep {
        0% { transform: translateX(-1200px); }
        100% { transform: translateX(1200px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.85; }
      }
      @keyframes blinker {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes rotateRings {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .floating-hero { animation: floatSlow 6s ease-in-out infinite; }
      .floating-badges { animation: floatFast 4s ease-in-out infinite; }
      .laser-beam { animation: beamSweep 7s linear infinite; }
      .pulse-light { animation: pulseGlow 3s ease-in-out infinite; }
      .status-blink { animation: blinker 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      .circuit-line {
        stroke-dasharray: 8 16;
        animation: dashMove 2.5s linear infinite;
      }
      .ring-spin {
        transform-origin: 1080px 110px;
        animation: rotateRings 20s linear infinite;
      }
      .chip-hover {
        transition: all 0.3s ease;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)" />

  <!-- Ambient Glowing Aura Orbs -->
  <rect width="1200" height="420" fill="url(#orbCyan)" />
  <rect width="1200" height="420" fill="url(#orbPurple)" />
  <rect width="1200" height="420" fill="url(#orbPink)" />

  <!-- Digital Tech Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#cyberGrid)" />

  <!-- Diagonal Cyber Accent Lines -->
  <g opacity="0.35">
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#38BDF8" stroke-width="0.5" stroke-dasharray="4 8" />
    <line x1="0" y1="340" x2="1200" y2="340" stroke="#818CF8" stroke-width="0.5" stroke-dasharray="4 8" />
  </g>

  <!-- Circuit Network Paths with Animated Data Packets -->
  <g fill="none" opacity="0.7">
    <!-- Path 1: Left to Center -->
    <path d="M 60 140 L 220 140 L 290 200 L 360 200" stroke="#1E293B" stroke-width="1.5" />
    <path d="M 60 140 L 220 140 L 290 200 L 360 200" stroke="#06B6D4" stroke-width="1.8" class="circuit-line" />

    <!-- Path 2: Bottom-Left Branch -->
    <path d="M 120 340 L 240 340 L 310 270 L 410 270" stroke="#1E293B" stroke-width="1.5" />
    <path d="M 120 340 L 240 340 L 310 270 L 410 270" stroke="#818CF8" stroke-width="1.8" class="circuit-line" />

    <!-- Path 3: Right to Center -->
    <path d="M 1140 160 L 980 160 L 910 210 L 840 210" stroke="#1E293B" stroke-width="1.5" />
    <path d="M 1140 160 L 980 160 L 910 210 L 840 210" stroke="#A855F7" stroke-width="1.8" class="circuit-line" />

    <!-- Path 4: Bottom-Right Branch -->
    <path d="M 1080 340 L 950 340 L 880 270 L 780 270" stroke="#1E293B" stroke-width="1.5" />
    <path d="M 1080 340 L 950 340 L 880 270 L 780 270" stroke="#38BDF8" stroke-width="1.8" class="circuit-line" />
  </g>

  <!-- Animated Neural Nodes -->
  <g>
    <!-- Node 1 -->
    <circle cx="220" cy="140" r="4" fill="#06B6D4" filter="url(#softGlow)" />
    <circle cx="220" cy="140" r="8" fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.6" class="pulse-light" />
    
    <!-- Node 2 -->
    <circle cx="310" cy="270" r="4" fill="#818CF8" filter="url(#softGlow)" />
    <circle cx="310" cy="270" r="9" fill="none" stroke="#818CF8" stroke-width="1" opacity="0.6" class="pulse-light" />

    <!-- Node 3 -->
    <circle cx="980" cy="160" r="4" fill="#A855F7" filter="url(#softGlow)" />
    <circle cx="980" cy="160" r="8" fill="none" stroke="#A855F7" stroke-width="1" opacity="0.6" class="pulse-light" />

    <!-- Node 4 -->
    <circle cx="880" cy="270" r="4" fill="#38BDF8" filter="url(#softGlow)" />
    <circle cx="880" cy="270" r="9" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.6" class="pulse-light" />
  </g>

  <!-- Futuristic Tech Hologram Rings (Top Right) -->
  <g class="ring-spin" opacity="0.45">
    <circle cx="1080" cy="110" r="60" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="10 15" />
    <circle cx="1080" cy="110" r="45" fill="none" stroke="#818CF8" stroke-width="1.2" stroke-dasharray="25 35" />
    <circle cx="1080" cy="110" r="30" fill="none" stroke="#C084FC" stroke-width="0.8" stroke-dasharray="6 8" />
  </g>

  <!-- Laser Scanning Beam (Sweeps Horizontally Across Banner) -->
  <g class="laser-beam">
    <rect x="0" y="0" width="300" height="420" fill="url(#beamGradient)" opacity="0.25" />
  </g>

  <!-- TOP STATUS BAR -->
  <g>
    <!-- System Online Pill Indicator -->
    <rect x="60" y="38" width="230" height="32" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <circle cx="82" cy="54" r="5" fill="#10B981" class="status-blink" filter="url(#softGlow)" />
    <text x="96" y="59" fill="#94A3B8" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1">
      AI-FIRST ARCHITECTURE
    </text>

    <!-- Right Header Telemetry -->
    <g opacity="0.9">
      <rect x="880" y="38" width="260" height="32" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="900" y="59" fill="#38BDF8" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.5">
        SYS.READY // AGENTS ACTIVE
      </text>
      <circle cx="1116" cy="54" r="4" fill="#38BDF8" class="pulse-light" />
    </g>
  </g>

  <!-- HERO CENTER SECTION -->
  <g class="floating-hero">
    <!-- Glow Backdrop for Name -->
    <text x="600" y="156" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#38BDF8" 
          opacity="0.3" 
          filter="url(#neonGlow)">
      JILLUR RAHMAN
    </text>

    <!-- Foreground Gradient Title -->
    <text x="600" y="156" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="5" 
          fill="url(#cyberGradient)">
      JILLUR RAHMAN
    </text>

    <!-- High-Impact Subtitle Pill Tag -->
    <g transform="translate(600, 195)">
      <!-- Animated Border Frame -->
      <rect x="-310" y="-18" width="620" height="36" rx="18" fill="#090E17" stroke="url(#borderGradient)" stroke-width="1.5" />
      
      <!-- Cyan Accent Dot -->
      <circle cx="-285" cy="0" r="4" fill="#38BDF8" class="pulse-light" />
      
      <!-- Subtitle Text -->
      <text x="0" y="6" 
            text-anchor="middle" 
            font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" 
            font-size="14.5" 
            font-weight="700" 
            letter-spacing="2" 
            fill="#F1F5F9">
        AI-FIRST SOFTWARE ENGINEER
      </text>
      
      <!-- Violet Accent Dot -->
      <circle cx="285" cy="0" r="4" fill="#C084FC" class="pulse-light" />
    </g>

    <!-- Expanded Architectural Focus Pipeline -->
    <text x="600" y="260" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="15" 
          font-weight="500" 
          letter-spacing="1.2" 
          fill="#94A3B8">
      <tspan fill="#38BDF8" font-weight="700">Context Engineering</tspan>
      <tspan fill="#475569"> • </tspan>
      <tspan fill="#60A5FA" font-weight="700">React Native</tspan>
      <tspan fill="#475569"> • </tspan>
      <tspan fill="#818CF8" font-weight="700">TypeScript</tspan>
      <tspan fill="#475569"> • </tspan>
      <tspan fill="#A78BFA" font-weight="700">Next.js</tspan>
      <tspan fill="#475569"> • </tspan>
      <tspan fill="#C084FC" font-weight="700">System Design</tspan>
    </text>
  </g>

  <!-- BOTTOM SPECIALIZATION BADGES -->
  <g class="floating-badges" transform="translate(0, 305)">
    <!-- Badge 1: Context Engineering -->
    <g transform="translate(90, 0)">
      <rect width="180" height="42" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="26" cy="21" r="5" fill="#38BDF8" filter="url(#softGlow)" />
      <text x="44" y="26" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Context Systems</text>
    </g>

    <!-- Badge 2: React Native -->
    <g transform="translate(295, 0)">
      <rect width="180" height="42" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="26" cy="21" r="5" fill="#61DAFB" filter="url(#softGlow)" />
      <text x="44" y="26" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">React Native</text>
    </g>

    <!-- Badge 3: TypeScript & Next.js -->
    <g transform="translate(500, 0)">
      <rect width="200" height="42" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="26" cy="21" r="5" fill="#3178C6" filter="url(#softGlow)" />
      <text x="44" y="26" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">TypeScript &amp; Next.js</text>
    </g>

    <!-- Badge 4: AI Agents & Auto -->
    <g transform="translate(725, 0)">
      <rect width="180" height="42" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="26" cy="21" r="5" fill="#A855F7" filter="url(#softGlow)" />
      <text x="44" y="26" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AI Agents &amp; Workflows</text>
    </g>

    <!-- Badge 5: System Design -->
    <g transform="translate(930, 0)">
      <rect width="180" height="42" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="26" cy="21" r="5" fill="#10B981" filter="url(#softGlow)" />
      <text x="44" y="26" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Scalable Architecture</text>
    </g>
  </g>

  <!-- Crisp Outer Ambient Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#borderGradient)" stroke-width="1.2" opacity="0.6" />
</svg>
